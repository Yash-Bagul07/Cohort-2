<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CyberSentry</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.4/dist/socket.io.min.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
        }
        .dark .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
        }
        .alert-critical {
            border-left: 4px solid #ef4444;
        }
        .alert-warning {
            border-left: 4px solid #f59e0b;
        }
        .alert-info {
            border-left: 4px solid #3b82f6;
        }
        @media (max-width: 768px) {
            .chart-container {
                height: 250px !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300" onload="initDashboard()">
<!-- Navbar -->
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-feather="shield"></i>
                <span class="font-bold text-xl">CyberSentry</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="./index.html" class="hover:text-blue-200">Home</a>
                <a href="./dashboard.html" class="hover:text-blue-200 font-medium">Dashboard</a>
                <a href="./logs.html" class="hover:text-blue-200">Logs</a>
                <a href="./reports.html" class="hover:text-blue-200">Reports</a>
                <a href="./settings.html" class="hover:text-blue-200">Settings</a>
            </div>
<div class="flex items-center space-x-4">
                <button id="darkModeToggle" class="p-2 rounded-full hover:bg-blue-800">
                    <i data-feather="moon"></i>
                </button>
                <div class="relative">
                    <button id="userMenuButton" class="flex items-center space-x-2">
                        <span class="font-medium">Admin</span>
                        <i data-feather="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-10">
                        <a href="./profile.html" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Profile</a>
                        <a href="./logout" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Logout</a>
                    </div>
                </div>  
            </div>
            <button id="mobileMenuButton" class="md:hidden p-2">
                <i data-feather="menu"></i>
            </button>
        </div>
        <!-- Mobile menu -->
        <div id="mobileMenu" class="md:hidden hidden gradient-bg px-4 pb-4">
            <a href="./index.html" class="block py-2 hover:text-blue-200">Home</a>
            <a href="./dashboard.html" class="block py-2 hover:text-blue-200 font-medium">Dashboard</a>
            <a href="./logs.html" class="block py-2 hover:text-blue-200">Logs</a>
            <a href="./reports.html" class="block py-2 hover:text-blue-200">Reports</a>
            <a href="./settings.html" class="block py-2 hover:text-blue-200">Settings</a>
            <div class="border-t border-blue-400 mt-2 pt-2">
                <a href="./profile.html" class="block py-2 hover:text-blue-200">Profile</a>
                <a href="#" id="logoutBtn" class="block py-2 hover:text-blue-200">Logout</a>
            </div>
        </div>
</nav>
    <!-- Dashboard Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-blue-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm">Total Packets</p>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white" id="totalPackets">0</h3>
                    </div>
                    <div class="bg-blue-100 dark:bg-blue-900 p-3 rounded-full">
                        <i data-feather="activity" class="w-6 h-6 text-blue-600 dark:text-blue-300"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-yellow-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm">Suspicious Packets</p>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white" id="suspiciousPackets">0</h3>
                    </div>
                    <div class="bg-yellow-100 dark:bg-yellow-900 p-3 rounded-full">
                        <i data-feather="alert-triangle" class="w-6 h-6 text-yellow-600 dark:text-yellow-300"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-red-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm">High Threat Packets</p>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white" id="highThreatPackets">0</h3>
                    </div>
                    <div class="bg-red-100 dark:bg-red-900 p-3 rounded-full">
                        <i data-feather="shield-off" class="w-6 h-6 text-red-600 dark:text-red-300"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 border-l-4 border-green-500">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm">Recent Alerts (24h)</p>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white" id="recentAlerts">0</h3>
                    </div>
                    <div class="bg-green-100 dark:bg-green-900 p-3 rounded-full">
                        <i data-feather="bell" class="w-6 h-6 text-green-600 dark:text-green-300"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
            <!-- Traffic Chart -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3">Network Traffic Overview</h3>
                <div class="chart-container" style="height: 300px">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>
            
            <!-- Threat Distribution Chart -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3">Threat Level Distribution</h3>
                <div class="chart-container" style="height: 300px">
                    <canvas id="threatChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Real-time Alerts -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <h3 class="text-lg font-bold text-gray-800 dark:text-white">Real-time Alerts</h3>
                <div class="w-full sm:w-auto">
                    <select id="timeRange" class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2">
                        <option value="1h">Last 1 hour</option>
                        <option value="24h" selected>Last 24 hours</option>
                        <option value="7d">Last 7 days</option>
                    </select>
                </div>
            </div>
            <div id="alertsContainer" class="space-y-3 max-h-96 overflow-y-auto">
                <!-- Alerts will be populated here -->
            </div>
        </div>

    </main>

    <script>
        // Initialize dashboard
        function initDashboard() {
            feather.replace();
            setupDarkModeToggle();
            setupSocketConnection();
            initCharts();
            loadInitialData();
        }

        // Setup dark mode toggle
        function setupDarkModeToggle() {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const html = document.documentElement;
            
            if (localStorage.getItem('darkMode') === 'true') {
                html.classList.add('dark');
                darkModeToggle.innerHTML = feather.icons['sun'].toSvg();
            }
            
            darkModeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                localStorage.setItem('darkMode', isDark);
                darkModeToggle.innerHTML = isDark 
                    ? feather.icons['sun'].toSvg() 
                    : feather.icons['moon'].toSvg();
            });
        }

        // Setup WebSocket connection for real-time updates
        function setupSocketConnection() {
            const socket = io('http://localhost:5000');
            
            socket.on('stats_update', (data) => {
                updateStats(data);
            });
            
            socket.on('new_alert', (alert) => {
                addAlert(alert);
            });
            
            socket.on('traffic_update', (data) => {
                updateTrafficChart(data);
            });
            
            socket.on('threat_update', (data) => {
                updateThreatChart(data);
            });
        }

        // Initialize charts
        function initCharts() {
            // Traffic Chart
            const trafficCtx = document.getElementById('trafficChart').getContext('2d');
            window.trafficChart = new Chart(trafficCtx, {
                type: 'line',
                data: {
                    labels: Array(24).fill().map((_, i) => i + ':00'),
                    datasets: [{
                        label: 'Packets/sec',
                        data: Array(24).fill(0),
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // Threat Chart
            const threatCtx = document.getElementById('threatChart').getContext('2d');
            window.threatChart = new Chart(threatCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Critical', 'Warning', 'Normal'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: [
                            '#ef4444',
                            '#f59e0b',
                            '#3b82f6'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                        }
                    }
                }
            });
        }

        // Load initial data
        async function loadInitialData() {
            try {
                const response = await fetch('http://localhost:5000/api/dashboard');
                const data = await response.json();
                
                if (response.ok) {
                    updateStats(data.stats);
                    updateTrafficChart(data.traffic);
                    updateThreatChart(data.threats);
                    
                    // Load alerts
                    data.alerts.forEach(alert => addAlert(alert));
                }
            } catch (error) {
                console.error('Failed to load initial data:', error);
            }
        }

        // Update stats cards
        function updateStats(stats) {
            document.getElementById('totalPackets').textContent = stats.totalPackets.toLocaleString();
            document.getElementById('suspiciousPackets').textContent = stats.suspiciousPackets.toLocaleString();
            document.getElementById('highThreatPackets').textContent = stats.highThreatPackets.toLocaleString();
            document.getElementById('recentAlerts').textContent = stats.recentAlerts.toLocaleString();
        }

        // Update traffic chart
        function updateTrafficChart(data) {
            window.trafficChart.data.datasets[0].data = data;
            window.trafficChart.update();
        }

        // Update threat chart
        function updateThreatChart(data) {
            window.threatChart.data.datasets[0].data = [
                data.critical,
                data.warning,
                data.normal
            ];
            window.threatChart.update();
        }

        // Add new alert
        function addAlert(alert) {
            const container = document.getElementById('alertsContainer');
            const alertClasses = {
                critical: 'alert-critical bg-red-50 dark:bg-red-900/20',
                warning: 'alert-warning bg-yellow-50 dark:bg-yellow-900/20',
                info: 'alert-info bg-blue-50 dark:bg-blue-900/20'
            };
            
            const alertDiv = document.createElement('div');
            alertDiv.className = `p-4 rounded-lg ${alertClasses[alert.severity] || alertClasses.info}`;
            alertDiv.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <h4 class="font-bold ${alert.severity === 'critical' ? 'text-red-800 dark:text-red-300' : 
                          alert.severity === 'warning' ? 'text-yellow-800 dark:text-yellow-300' : 
                          'text-blue-800 dark:text-blue-300'}">
                            ${alert.title}
                        </h4>
                        <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">${alert.message}</p>
                    </div>
                    <span class="text-xs text-gray-500 dark:text-gray-400">${new Date(alert.timestamp).toLocaleTimeString()}</span>
                </div>
                <div class="mt-2 flex items-center text-xs">
                    <span class="inline-block px-2 py-1 rounded-full ${alert.severity === 'critical' ? 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200' : 
                    alert.severity === 'warning' ? 'bg-yellow-100 dark:bg-yellow-900 text-yellow-800 dark:text-yellow-200' : 
                    'bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200'}">
                        ${alert.source}
                    </span>
                </div>
            `;
            
            // Add new alert at the top
            if (container.firstChild) {
                container.insertBefore(alertDiv, container.firstChild);
            } else {
                container.appendChild(alertDiv);
            }
        }

        // Handle logout
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        // Handle user menu toggle
        document.getElementById('userMenuButton')?.addEventListener('click', () => {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        });

        // Handle mobile menu toggle
        document.getElementById('mobileMenuButton')?.addEventListener('click', () => {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
            const icon = document.getElementById('mobileMenuButton').querySelector('svg');
            if (icon) {
                icon.setAttribute('data-feather', menu.classList.contains('hidden') ? 'menu' : 'x');
                feather.replace();
            }
        });
    </script>
