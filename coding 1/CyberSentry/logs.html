<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Logs | CyberSentry</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.4/dist/socket.io.min.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
        }
        .dark .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
        }
        .threat-high { background-color: #fef2f2; border-left: 4px solid #ef4444; }
        .threat-medium { background-color: #fffbeb; border-left: 4px solid #f59e0b; }
        .threat-normal { background-color: #f0f9ff; border-left: 4px solid #3b82f6; }
        .dark .threat-high { background-color: #7f1d1d; border-left: 4px solid #ef4444; }
        .dark .threat-medium { background-color: #78350f; border-left: 4px solid #f59e0b; }
        .dark .threat-normal { background-color: #1e3a8a; border-left: 4px solid #3b82f6; }
        @media (max-width: 768px) {
            .log-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300" onload="initLogs()">
    <!-- Navbar -->
    <nav class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-feather="shield"></i>
                <span class="font-bold text-xl">CyberSentry</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="./index.html" class="hover:text-blue-200">Home</a>
                <a href="./dashboard.html" class="hover:text-blue-200">Dashboard</a>
                <a href="./logs.html" class="hover:text-blue-200 font-medium">Logs</a>
                <a href="./reports.html" class="hover:text-blue-200">Reports</a>
                <a href="./settings.html" class="hover:text-blue-200">Settings</a>
            </div>
            <div class="flex items-center space-x-4">
                <button id="darkModeToggle" class="p-2 rounded-full hover:bg-blue-800">
                    <i data-feather="moon"></i>
                </button>
                <div class="relative">
                    <button id="userMenuButton" class="flex items-center space-x-2">
                        <span class="font-medium">Admin</span>
                        <i data-feather="chevron-down" class="w-4 h-4"></i>
                    </button>
                    <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-10">
                        <a href="./profile.html" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Profile</a>
                        <a href="#" id="logoutBtn" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700">Logout</a>
                    </div>
                </div>
            </div>
            <button id="mobileMenuButton" class="md:hidden p-2">
                <i data-feather="menu"></i>
            </button>
        </div>
        <!-- Mobile menu -->
        <div id="mobileMenu" class="md:hidden hidden gradient-bg px-4 pb-4">
            <a href="./index.html" class="block py-2 hover:text-blue-200">Home</a>
            <a href="./dashboard.html" class="block py-2 hover:text-blue-200">Dashboard</a>
            <a href="./logs.html" class="block py-2 hover:text-blue-200 font-medium">Logs</a>
            <a href="./reports.html" class="block py-2 hover:text-blue-200">Reports</a>
            <a href="./settings.html" class="block py-2 hover:text-blue-200">Settings</a>
            <div class="border-t border-blue-400 mt-2 pt-2">
                <a href="./profile.html" class="block py-2 hover:text-blue-200">Profile</a>
                <a href="#" id="logoutBtnMobile" class="block py-2 hover:text-blue-200">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Network Logs</h1>
            <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3">
                <div class="relative w-full sm:w-48">
                    <select id="logLevel" class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                        <option value="all">All Logs</option>
                        <option value="high">High Threat</option>
                        <option value="medium">Medium Threat</option>
                        <option value="normal">Normal</option>
                    </select>
                </div>
                <div class="relative w-full sm:w-48">
                    <select id="timeRange" class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                        <option value="1h">Last 1 hour</option>
                        <option value="24h" selected>Last 24 hours</option>
                        <option value="7d">Last 7 days</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
            <div class="log-table">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-50 dark:bg-gray-700">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Timestamp</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Source IP</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Destination IP</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Protocol</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Threat Level</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                        <!-- Logs will be populated here -->
                    </tbody>
                </table>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-700 border-t border-gray-200 dark:border-gray-600 flex items-center justify-between">
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    Showing <span id="showingFrom">1</span> to <span id="showingTo">10</span> of <span id="totalLogs">0</span> entries
                </div>
                <div class="flex space-x-2">
                    <button id="prevPageBtn" class="px-3 py-1 bg-gray-200 dark:bg-gray-600 rounded-md disabled:opacity-50" disabled>Previous</button>
                    <button id="nextPageBtn" class="px-3 py-1 bg-gray-200 dark:bg-gray-600 rounded-md disabled:opacity-50" disabled>Next</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize logs page
        function initLogs() {
            feather.replace();
            setupDarkModeToggle();
            setupSocketConnection();
            loadInitialLogs();
            setupEventListeners();
        }

        // Setup dark mode toggle
        function setupDarkModeToggle() {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const html = document.documentElement;
            
            if (localStorage.getItem('darkMode') === 'true') {
                html.classList.add('dark');
                darkModeToggle.innerHTML = feather.icons['sun'].toSvg();
            }
            
            darkModeToggle.addEventListener('click', () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                localStorage.setItem('darkMode', isDark);
                darkModeToggle.innerHTML = isDark 
                    ? feather.icons['sun'].toSvg() 
                    : feather.icons['moon'].toSvg();
            });
        }

        // Setup WebSocket connection for real-time logs
        function setupSocketConnection() {
            const socket = io('http://localhost:5000');
            
            socket.on('new_log', (log) => {
                addLogToTable(log);
                updateLogCount();
            });
            
            socket.on('initial_logs', (logs) => {
                populateLogsTable(logs);
                updateLogCount();
            });
        }

        // Load initial logs
        async function loadInitialLogs() {
            try {
                const response = await fetch('http://localhost:5000/api/logs');
                const data = await response.json();
                
                if (response.ok) {
                    populateLogsTable(data.logs);
                    updateLogCount();
                }
            } catch (error) {
                console.error('Failed to load initial logs:', error);
            }
        }

        // Populate logs table
        function populateLogsTable(logs) {
            const tableBody = document.getElementById('logsTableBody');
            tableBody.innerHTML = '';
            
            logs.forEach(log => {
                addLogToTable(log);
            });
        }

        // Add single log to table
        function addLogToTable(log) {
            const tableBody = document.getElementById('logsTableBody');
            
            const row = document.createElement('tr');
            row.className = log.threatLevel === 'high' ? 'threat-high' : 
                           log.threatLevel === 'medium' ? 'threat-medium' : 'threat-normal';
            
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 dark:text-white">
                    ${new Date(log.timestamp).toLocaleString()}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-300">
                    ${log.sourceIP}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-300">
                    ${log.destinationIP}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-300">
                    ${log.protocol}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                        ${log.threatLevel === 'high' ? 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200' : 
                        log.threatLevel === 'medium' ? 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200' : 
                        'bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200'}">
                        ${log.threatLevel.charAt(0).toUpperCase() + log.threatLevel.slice(1)}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-300">
                    <button class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">
                        <i data-feather="eye" class="w-4 h-4"></i>
                    </button>
                    <button class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">
                        <i data-feather="trash-2" class="w-4 h-4"></i>
                    </button>
                </td>
            `;
            
            tableBody.prepend(row);
            feather.replace();
        }

        // Update log count display
        function updateLogCount() {
            const totalLogs = document.getElementById('logsTableBody').children.length;
            document.getElementById('totalLogs').textContent = totalLogs;
        }

        // Setup event listeners
        function setupEventListeners() {
            // Handle logout
            document.getElementById('logoutBtn')?.addEventListener('click', logout);
            document.getElementById('logoutBtnMobile')?.addEventListener('click', logout);
            
            // Handle user menu toggle
            document.getElementById('userMenuButton')?.addEventListener('click', () => {
                const menu = document.getElementById('userMenu');
                menu.classList.toggle('hidden');
            });
            
            // Handle mobile menu toggle
            document.getElementById('mobileMenuButton')?.addEventListener('click', () => {
                const menu = document.getElementById('mobileMenu');
                menu.classList.toggle('hidden');
                const icon = document.getElementById('mobileMenuButton').querySelector('svg');
                if (icon) {
                    icon.setAttribute('data-feather', menu.classList.contains('hidden') ? 'menu' : 'x');
                    feather.replace();
                }
            });
            
            // Handle log level filter
            document.getElementById('logLevel').addEventListener('change', filterLogs);
            
            // Handle time range filter
            document.getElementById('timeRange').addEventListener('change', filterLogs);
        }

        // Filter logs based on selected criteria
        function filterLogs() {
            const level = document.getElementById('logLevel').value;
            const timeRange = document.getElementById('timeRange').value;
            
            // In a real implementation, this would fetch filtered logs from the server
            console.log(`Filtering logs - Level: ${level}, Time Range: ${timeRange}`);
        }

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }
  </script>
</body>
